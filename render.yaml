services:
  - type: web
    name: epic-craft
    runtime: node
    plan: free
    region: oregon
    rootDir: Source/App
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_DRIVE_MASTER_FOLDER_ID
        value: 1BisxzQ0xkseowtbaTe5FNhtTCRE8JFJf
      - key: GOOGLE_DRIVE_MASTER_FOLDER_URL
        value: https://drive.google.com/drive/folders/1BisxzQ0xkseowtbaTe5FNhtTCRE8JFJf?usp=drive_link
      - key: NEXT_PUBLIC_DEFAULT_DRIVE_FOLDER_URL
        value: https://drive.google.com/drive/folders/1BisxzQ0xkseowtbaTe5FNhtTCRE8JFJf?usp=drive_link
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
